# Invariants Specification (Loop Sentinel)
# Inspired by Microsoft PromptKit - Formal system-level constraints and guarantees.
version: 1

invariants:
  # 1. 安全不變量 (Safety Invariants) - 任何情況下絕對不可打破的物理與資料邊界
  safety:
    - id: INV_SAFE_01
      name: "No Hardcoded Secrets"
      description: "嚴禁在任何代碼、設定檔或日誌中硬編碼 API 金鑰、Token、私鑰或密碼"
      severity: "CRITICAL"
      category: "security"

    - id: INV_SAFE_02
      name: "Normalized Path Sanitization"
      description: "所有檔案與目錄路徑操作必須經由正規化處理（轉換反斜線並過濾相對目錄穿透），防止 Windows/POSIX 繞過"
      severity: "CRITICAL"
      category: "security"

    - id: INV_SAFE_03
      name: "Denylist Path Protection"
      description: "禁止對 gate.yaml 定義之敏感路徑（.env*, credentials/**, secrets/**, auth/**, billing/**）進行寫入或刪除"
      severity: "CRITICAL"
      category: "security"

    - id: INV_SAFE_04
      name: "Git Baseline Safety Net"
      description: "任何代碼生成或修改前，工作區必須受 Git 版本控制保護且具備乾淨存檔基準點；無 Git 倉庫嚴禁動手改代碼"
      severity: "CRITICAL"
      category: "safety_net"

  # 2. 狀態不變量 (State Invariants) - 確保持久化記憶與工作流狀態具備單調性與完整性
  state:
    - id: INV_STATE_01
      name: "Monotonic State Timestamp"
      description: "STATE.md 的 Last run 時間戳每次更新時必須單調遞增，不可倒退"
      severity: "HIGH"
      category: "integrity"

    - id: INV_STATE_02
      name: "Snapshot Closed-Loop Verification (C1/N1)"
      description: "寫入 SNAPSHOT.jsonl 前必須符合 C1 閉環檢驗（模組已驗證），若處於報錯狀態（N1）嚴禁封裝長期快照"
      severity: "HIGH"
      category: "memory"

  # 3. 範疇與漂移不變量 (Scope & Drift Invariants) - 防止意圖膨脹與未經審查代碼散落
  scope:
    - id: INV_SCOPE_01
      name: "Max Files Bound"
      description: "單次任務變更之有效檔案數不得超過 gate.yaml 上限 (預設 8 檔案)"
      severity: "CRITICAL"
      category: "blast_radius"

    - id: INV_SCOPE_02
      name: "Value-Driven Testing (Authoring Gate)"
      description: "新增或修改測試必須通過門禁四問：保護可觀察契約、具可信退化、非重複覆蓋、不增設生產接縫；嚴禁為追求行數而撰寫無效測試"
      severity: "HIGH"
      category: "verification"

    - id: INV_SCOPE_03
      name: "Complexity Monotonicity & Diff Bound"
      description: "Bug 修復之有效 Diff 必須符合 Ponytail 收斂原則，單次修復禁止行數暴增（>20行或>2檔案）或引入非必要包裝層"
      severity: "HIGH"
      category: "blast_radius"

  # 4. 驗證協議不變量 (Verification Protocol Invariants) - 確保 Maker / Checker 嚴格制衡
  verification:
    - id: INV_VERIFY_01
      name: "Maker/Checker Separation"
      description: "實作者 (Maker) 不得自行宣稱測試通過；必須由驗證者 (Checker) 獨立複檢"
      severity: "HIGH"
      category: "governance"

    - id: INV_ARCH_01
      name: "Verifiable Layer Boundaries"
      description: "代碼依賴應符合 layers.json 單向分層宣告，避免向上依賴或環狀侵入；關鍵模組建議配備 AGENTS.md。宣告式規範，目前無自動檢查器"
      severity: "ADVISORY"
      category: "architecture"

    - id: INV_VERIFY_02
      name: "Zero Junk Test Patterns"
      description: "測試代碼中嚴禁 15 種垃圾模式（如空斷言、Mock 自身被測行為、自我比較、純字串 grep、受測者自算期望值等）"
      severity: "HIGH"
      category: "quality"

    - id: INV_VERIFY_03
      name: "No Unnecessary Production Seams"
      description: "嚴禁僅為測試目的而在生產代碼中暴露 private 介面、新增可選 mock 參數、注入包裝函式或全域重置鉤子"
      severity: "CRITICAL"
      category: "architecture"

    - id: INV_VERIFY_04
      name: "Fail-Before-Pass Bug Verification"
      description: "Bug 修復測試必須在修復前源碼上明確失敗，修復後通過；未曾失敗過之測試判定為無效，嚴禁偽造回歸證明"
      severity: "HIGH"
      category: "verification"

    - id: INV_VERIFY_05
      name: "Two-Strike Circuit Breaker & Hard Rollback"
      description: "同一問題若連續兩次修復未收斂，嚴禁第 3 次向前修補，必須在 0.05 秒內執行物理回滾 (git restore .) 並向人類 Escalation"
      severity: "CRITICAL"
      category: "circuit_breaker"

    - id: INV_VERIFY_06
      name: "Reflexion Verbal Memory Protocol"
      description: "Strike 1 失敗後必須生成三段式口語反思 (錯誤假設/根因定位/修正策略) 始可進行第 2 次嘗試；兩振回滾時經 --reflexion 寫入 eval_incidents.jsonl 與 SNAPSHOT.jsonl；STATE.md Watch List 需手動補記"
      severity: "HIGH"
      category: "circuit_breaker"

    - id: INV_VERIFY_07
      name: "Proof-of-Execution & Zero Fabrication Receipt"
      description: "宣稱實作或測試完成時必須附上 local_guard.py 產出之真實 [GUARD-RECEIPT] 簽章；遇到 RTK 壓縮輸出 ok 時嚴禁腦補假 Commit Hash 或假測試數據；未經 read_file 嚴禁捏造檔案行號"
      severity: "CRITICAL"
      category: "anti_hallucination"
